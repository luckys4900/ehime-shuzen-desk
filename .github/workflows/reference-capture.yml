name: Reference capture (analysis only)

on:
  push:
    branches: [main-9c3jqk]
    paths: ['.github/reference/**', 'scripts/ref-capture.mjs']
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk >/dev/null
      - run: node scripts/ref-capture.mjs
      - name: Encrypt captures and push to a temporary branch (ciphertext only)
        run: |
          tar czf caps.tgz ref-captures
          openssl rand -out k.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in caps.tgz -out caps.enc -pass file:k.bin
          openssl pkeyutl -encrypt -pubin -inkey .github/reference/capture-pubkey.pem -in k.bin -out k.enc
          mkdir out && mv caps.enc k.enc out/
          cd out
          git init -q -b ref-capture-tmp
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add . && git commit -qm "encrypted reference captures (temporary)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ref-capture-tmp
